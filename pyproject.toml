[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-core"
version = "0.1.0"
description = "Core retrieval library"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff"
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_core"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
